# Phase 3 analytics stack — OPT-IN overlay, separate from the production compose and deploy.yaml.
#   docker compose -f docker-compose.analytics.yml up -d redpanda
#   docker compose -f docker-compose.analytics.yml up -d clickhouse
# Image tags are pinned on purpose (verified to start on a 2.9 GB dev VM). Memory caps are for
# DEV; size production from observed event volume (docs/recommendation/05-deployment.md).
name: echo-analytics
services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.1
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:19092
      - --advertise-kafka-addr=PLAINTEXT://localhost:19092
    ports:
      - '127.0.0.1:19092:19092'
    mem_limit: 900m
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ['CMD', 'rpk', 'cluster', 'health', '--exit-when-healthy']
      interval: 10s
      timeout: 10s
      retries: 12

  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: echo
      CLICKHOUSE_USER: echo
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-echo}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: '1'
    ports:
      - '127.0.0.1:18123:8123'
    mem_limit: 1200m
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:8123/ping']
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  redpanda-data:
  clickhouse-data:
