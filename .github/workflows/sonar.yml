name: SonarQube

on:
  push:
    branches:
      - main
      - sonar-scan

jobs:
  sonar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.exclusions=**/test/**,**/tests/**,**/__tests__/**,**/node_modules/**,**/dist/**,**/build/**
