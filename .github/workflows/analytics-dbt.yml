# Phase 3: scheduled dbt build of the ClickHouse marts. Inert until you opt in:
#   repo variable  RECSYS_DBT_ENABLED = true
#   repo secrets   DBT_CH_HOST, DBT_CH_PORT, DBT_CH_USER, DBT_CH_PASSWORD, DBT_CH_DATABASE
# The runner must be able to reach ClickHouse (self-hosted runner or an allow-listed IP).
# A failed build fails the workflow, which is the alert (GitHub notifies watchers of the repo).
# Does not touch deploy.yaml or any production service.
name: analytics-dbt
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: analytics-dbt
  cancel-in-progress: false

jobs:
  dbt-build:
    if: ${{ vars.RECSYS_DBT_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: dbt build (pinned container, see analytics/dbt/Dockerfile)
        env:
          DBT_CH_HOST: ${{ secrets.DBT_CH_HOST }}
          DBT_CH_PORT: ${{ secrets.DBT_CH_PORT }}
          DBT_CH_USER: ${{ secrets.DBT_CH_USER }}
          DBT_CH_PASSWORD: ${{ secrets.DBT_CH_PASSWORD }}
          DBT_CH_DATABASE: ${{ secrets.DBT_CH_DATABASE }}
        run: scripts/ops/run-dbt.sh build
